services:
  - type: web
    name: esp-route-planner
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e . --no-deps
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: prod
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
