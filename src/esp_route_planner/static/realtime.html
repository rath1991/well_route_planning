<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>George - ESP Field Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 2rem;
  }
  h1 { font-size: 1.8rem; margin-bottom: 0.3rem; color: #38bdf8; }
  .subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; }
  #status {
    padding: 0.5rem 1.2rem; border-radius: 999px; font-size: 0.85rem;
    margin-bottom: 1.5rem; font-weight: 500;
  }
  .status-disconnected { background: #1e293b; color: #94a3b8; }
  .status-connecting  { background: #1e3a5f; color: #7dd3fc; }
  .status-connected   { background: #064e3b; color: #6ee7b7; }
  .status-speaking    { background: #4c1d95; color: #c4b5fd; }
  .status-error       { background: #450a0a; color: #fca5a5; }

  #btn-connect {
    width: 120px; height: 120px; border-radius: 50%; border: none;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: all 0.3s ease; margin-bottom: 2rem;
    display: flex; align-items: center; justify-content: center;
  }
  #btn-connect.off {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    color: white; box-shadow: 0 0 30px rgba(59,130,246,0.3);
  }
  #btn-connect.off:hover {
    box-shadow: 0 0 50px rgba(59,130,246,0.5);
    transform: scale(1.05);
  }
  #btn-connect.on {
    background: linear-gradient(135deg, #dc2626, #ef4444);
    color: white; box-shadow: 0 0 30px rgba(239,68,68,0.3);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(239,68,68,0.3); }
    50% { box-shadow: 0 0 50px rgba(239,68,68,0.5); }
  }

  #transcript {
    width: 100%; max-width: 700px; flex: 1;
    background: #1e293b; border-radius: 12px;
    padding: 1.5rem; overflow-y: auto;
    max-height: 50vh; margin-bottom: 1rem;
  }
  .msg { margin-bottom: 1rem; padding: 0.8rem; border-radius: 8px; }
  .msg-user { background: #1e3a5f; border-left: 3px solid #3b82f6; }
  .msg-assistant { background: #1a2e1a; border-left: 3px solid #22c55e; }
  .msg-system { background: #2d2215; border-left: 3px solid #f59e0b; font-size: 0.85rem; }
  .msg-label {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 0.3rem; font-weight: 600;
  }
  .msg-user .msg-label { color: #60a5fa; }
  .msg-assistant .msg-label { color: #4ade80; }
  .msg-system .msg-label { color: #fbbf24; }
  .msg-text { font-size: 0.95rem; line-height: 1.5; }

  #visualizer {
    width: 100%; max-width: 700px; height: 60px;
    background: #1e293b; border-radius: 8px; margin-bottom: 1rem;
  }

  .hint { color: #64748b; font-size: 0.8rem; text-align: center; max-width: 500px; }
</style>
</head>
<body>
  <h1>George</h1>
  <p class="subtitle">ESP Field Engineer Voice Assistant</p>

  <div id="status" class="status-disconnected">Disconnected</div>

  <canvas id="visualizer"></canvas>

  <button id="btn-connect" class="off" onclick="toggleConnection()">Connect</button>

  <div id="transcript"></div>

  <p class="hint">
    Try: "Which wells have high water cut?" or "Plan my visits for 6 hours, max 6 stops"
  </p>

<script>
const SAMPLE_RATE = 24000;
let ws = null;

// Separate audio contexts: mic and playback never share a context
// This lets the browser's echo canceller work properly
let micCtx = null;
let playCtx = null;
let micStream = null;
let micProcessor = null;
let nextPlayTime = 0;
let canvasCtx = null;
let analyser = null;
let isSpeaking = false;  // true while George is speaking — stops mic data going to OpenAI

const btnConnect = document.getElementById('btn-connect');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const canvas = document.getElementById('visualizer');

// --- Audio Visualizer ---
function initVisualizer() {
  canvasCtx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  canvasCtx.scale(2, 2);
  drawVisualizer();
}

function drawVisualizer() {
  if (!canvasCtx) return;
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  canvasCtx.fillStyle = '#1e293b';
  canvasCtx.fillRect(0, 0, w, h);

  if (analyser) {
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const barW = w / data.length * 2.5;
    for (let i = 0; i < data.length; i++) {
      const barH = (data[i] / 255) * h * 0.9;
      const hue = 200 + (data[i] / 255) * 60;
      canvasCtx.fillStyle = `hsl(${hue}, 80%, ${40 + data[i]/255*30}%)`;
      canvasCtx.fillRect(i * barW, h - barH, barW - 1, barH);
    }
  }
  requestAnimationFrame(drawVisualizer);
}

// --- Status ---
function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = `status-${cls}`;
}

// --- Transcript ---
function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg msg-${role}`;
  div.innerHTML = `<div class="msg-label">${role}</div><div class="msg-text">${text}</div>`;
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

// --- WebSocket ---
function toggleConnection() {
  if (ws) { disconnect(); } else { connect(); }
}

async function connect() {
  setStatus('Connecting...', 'connecting');
  btnConnect.textContent = '...';

  try {
    // Get microphone with echo cancellation + noise suppression + auto gain
    micStream = await navigator.mediaDevices.getUserMedia({ audio: {
      sampleRate: SAMPLE_RATE,
      channelCount: 1,
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
    }});

    // Mic context — only for capturing microphone input
    micCtx = new AudioContext({ sampleRate: SAMPLE_RATE });

    // Playback context — completely separate, only for speaker output
    playCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
    analyser = playCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.connect(playCtx.destination);

    // Connect WebSocket
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/realtime`);

    ws.onopen = () => {
      setStatus('Connected - Speak now', 'connected');
      btnConnect.textContent = 'Stop';
      btnConnect.className = 'on';
      addMessage('system', 'Connected to George. You can start speaking.');
      startMicCapture();
    };

    ws.onmessage = (evt) => handleServerEvent(JSON.parse(evt.data));

    ws.onerror = (err) => {
      console.error('WebSocket error:', err);
      setStatus('Connection error', 'error');
      addMessage('system', 'Connection error. Try reconnecting.');
    };

    ws.onclose = () => {
      setStatus('Disconnected', 'disconnected');
      btnConnect.textContent = 'Connect';
      btnConnect.className = 'off';
      stopMicCapture();
      ws = null;
    };

  } catch (err) {
    console.error('Connect error:', err);
    setStatus('Error: ' + err.message, 'error');
    addMessage('system', 'Failed to connect: ' + err.message);
    btnConnect.textContent = 'Connect';
    btnConnect.className = 'off';
  }
}

function disconnect() {
  if (ws) { ws.close(); ws = null; }
  stopMicCapture();
  setStatus('Disconnected', 'disconnected');
  btnConnect.textContent = 'Connect';
  btnConnect.className = 'off';
}

// --- Microphone Capture (PCM16 @ 24kHz) ---
// Uses its own AudioContext (micCtx) so it never touches playback audio
function startMicCapture() {
  if (!micCtx || !micStream) return;
  const source = micCtx.createMediaStreamSource(micStream);

  micProcessor = micCtx.createScriptProcessor(4096, 1, 1);
  micProcessor.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    // Don't send mic audio while George is speaking — prevents OpenAI VAD
    // from treating speaker bleed as new user speech
    if (isSpeaking) return;
    const float32 = e.inputBuffer.getChannelData(0);
    const pcm16 = float32ToPcm16(float32);
    const b64 = arrayBufferToBase64(pcm16.buffer);

    ws.send(JSON.stringify({
      type: 'input_audio_buffer.append',
      audio: b64,
    }));
  };

  source.connect(micProcessor);
  // Connect to a silent destination so ScriptProcessor fires events
  const silentGain = micCtx.createGain();
  silentGain.gain.value = 0;
  micProcessor.connect(silentGain);
  silentGain.connect(micCtx.destination);
}

function stopMicCapture() {
  if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micCtx) { micCtx.close(); micCtx = null; }
  if (playCtx) { playCtx.close(); playCtx = null; analyser = null; }
}

// --- PCM Conversion ---
function float32ToPcm16(float32) {
  const pcm16 = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return pcm16;
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  for (let i = 0; i < bytes.byteLength; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

// --- Audio Playback ---
// Uses playCtx (separate from mic) so speaker output can't feed back into mic capture
function playAudioChunk(base64Audio) {
  if (!playCtx) return;
  const pcmBuffer = base64ToArrayBuffer(base64Audio);
  const int16 = new Int16Array(pcmBuffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) {
    float32[i] = int16[i] / 0x8000;
  }

  const audioBuffer = playCtx.createBuffer(1, float32.length, SAMPLE_RATE);
  audioBuffer.getChannelData(0).set(float32);

  const source = playCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(analyser);  // analyser is already connected to playCtx.destination

  const now = playCtx.currentTime;
  if (nextPlayTime < now) nextPlayTime = now;
  source.start(nextPlayTime);
  nextPlayTime += audioBuffer.duration;
}

// --- Handle OpenAI Events ---
let currentAssistantText = '';

function handleServerEvent(event) {
  const t = event.type;

  switch (t) {
    case 'session.created':
      addMessage('system', 'Session ready. Voice: ' + (event.session?.voice || 'ash'));
      break;

    case 'response.audio.delta':
      if (event.delta) {
        isSpeaking = true;
        setStatus('George is speaking...', 'speaking');
        playAudioChunk(event.delta);
      }
      break;

    case 'response.audio_transcript.delta':
      currentAssistantText += (event.delta || '');
      break;

    case 'response.audio_transcript.done':
      if (currentAssistantText) {
        addMessage('assistant', currentAssistantText);
        currentAssistantText = '';
      }
      setStatus('Connected - Speak now', 'connected');
      break;

    case 'conversation.item.input_audio_transcription.completed':
      if (event.transcript) {
        addMessage('user', event.transcript);
      }
      break;

    case 'response.function_call_arguments.done':
      isSpeaking = true;  // mute mic during tool execution + response
      addMessage('system', `Calling ${event.name}...`);
      setStatus('Processing query...', 'connecting');
      break;

    case 'response.done':
      // Wait a brief moment for audio to finish playing, then re-enable mic
      setTimeout(() => { isSpeaking = false; }, 500);
      setStatus('Connected - Speak now', 'connected');
      nextPlayTime = 0;
      break;

    case 'error':
      const errMsg = event.error?.message || JSON.stringify(event.error);
      addMessage('system', 'Error: ' + errMsg);
      setStatus('Error', 'error');
      break;

    case 'input_audio_buffer.speech_started':
      isSpeaking = false;  // user is interrupting — re-enable mic
      setStatus('Listening...', 'connected');
      nextPlayTime = 0;
      break;

    case 'input_audio_buffer.speech_stopped':
      setStatus('Processing...', 'connecting');
      break;
  }
}

// Init
initVisualizer();
</script>
</body>
</html>
